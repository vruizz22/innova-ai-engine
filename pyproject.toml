[project]
name = "innova-ai-engine"
version = "0.1.0"
description = "Innova EdTech — BKT/IRT/LLM/OCR ML workers"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "scipy>=1.11",
    "numpy>=1.26",
    "pydantic>=2.5",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
    "asyncpg>=0.29",
    "boto3>=1.34",
    "httpx>=0.27",
    "google-genai>=1.74.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "hypothesis>=6.100",
    "moto[sqs,s3]>=5.0",
    "ruff>=0.4",
    "pyright>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "hypothesis>=6.100",
    "moto[sqs,s3]>=5.0",
    "ruff>=0.4",
    "pyright>=1.1",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "RUF", "T201"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["src"]
exclude = ["tests"]
reportMissingTypeStubs = false
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownArgumentType = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "smoke: real API call, runs only on main branch CI",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
