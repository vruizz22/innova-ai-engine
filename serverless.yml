service: innova-ai-engine
frameworkVersion: '3'

provider:
  name: aws
  region: us-east-1
  stage: ${opt:stage, 'prod'}
  ecr:
    images:
      ai-engine-image:
        path: ./
        file: Dockerfile.lambda

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
            - sqs:SendMessage
          Resource: "*"
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
          Resource: "*"
        - Effect: Allow
          Action:
            - ssm:GetParameter
          Resource:
            - arn:aws:ssm:us-east-1:*:parameter/innova/*

  environment:
    STAGE: ${self:provider.stage}
    ANTHROPIC_API_KEY: ${env:ANTHROPIC_API_KEY, ''}
    GEMINI_API_KEY: ${env:GEMINI_API_KEY, ''}
    DATABASE_URL: ${env:DATABASE_URL, ''}
    MONGODB_URI: ${env:MONGODB_URI, ''}
    LOG_LEVEL: ${env:LOG_LEVEL, 'info'}
    OCR_CONFIDENCE_THRESHOLD: ${env:OCR_CONFIDENCE_THRESHOLD, '0.7'}
    LLM_BATCH_SIZE: ${env:LLM_BATCH_SIZE, '20'}
    SSM_LLM_PAUSED_PARAM: ${env:SSM_LLM_PAUSED_PARAM, '/innova/llm/paused'}
    SSM_OCR_PAUSED_PARAM: ${env:SSM_OCR_PAUSED_PARAM, '/innova/ocr/paused'}
    APP_AWS_REGION: ${env:APP_AWS_REGION, 'us-east-1'}
    # v9 guides pipeline — A6 guide_ingest_worker
    SQS_SOLUTION_GEN_URL: ${env:SQS_SOLUTION_GEN_URL, ''}
    S3_GUIDES_BUCKET: ${env:S3_GUIDES_BUCKET, ''}
    SSM_GUIDES_INGEST_PAUSED_PARAM: ${env:SSM_GUIDES_INGEST_PAUSED_PARAM, '/innova/guides/ingest_paused'}
    GUIDE_INGEST_CHUNK_PAGES: ${env:GUIDE_INGEST_CHUNK_PAGES, '20'}
    GUIDE_INGEST_CHUNK_OVERLAP: ${env:GUIDE_INGEST_CHUNK_OVERLAP, '1'}
    GUIDE_MIN_EXTRACTION_QUALITY: ${env:GUIDE_MIN_EXTRACTION_QUALITY, '0.5'}
    # v9 guides pipeline — A7 solution_generator
    SSM_GUIDES_SOLUTION_PAUSED_PARAM: ${env:SSM_GUIDES_SOLUTION_PAUSED_PARAM, '/innova/guides/solution_paused'}
    SOLUTION_GEN_USE_BATCHES: ${env:SOLUTION_GEN_USE_BATCHES, 'true'}
    SOLUTION_TOPIC_MIN_CONFIDENCE: ${env:SOLUTION_TOPIC_MIN_CONFIDENCE, '0.85'}
    # v9 guides pipeline — A8 submission_grader
    SQS_ATTEMPT_REPROCESS_URL: ${env:SQS_ATTEMPT_REPROCESS_URL, ''}
    S3_SUBMISSIONS_BUCKET: ${env:S3_SUBMISSIONS_BUCKET, ''}
    SSM_GUIDES_GRADING_PAUSED_PARAM: ${env:SSM_GUIDES_GRADING_PAUSED_PARAM, '/innova/guides/grading_paused'}
    SSM_GUIDES_CHEAP_MODE_PARAM: ${env:SSM_GUIDES_CHEAP_MODE_PARAM, '/innova/guides/grading_cheap_mode'}
    GRADING_MIN_TRANSCRIPTION_CONFIDENCE: ${env:GRADING_MIN_TRANSCRIPTION_CONFIDENCE, '0.5'}
    # M11 / A9.2 hourly_alerts — detector thresholds
    ALERT_AT_RISK_PKNOWN_FLOOR: ${env:ALERT_AT_RISK_PKNOWN_FLOOR, '0.4'}
    ALERT_AT_RISK_MIN_TOPICS: ${env:ALERT_AT_RISK_MIN_TOPICS, '3'}
    ALERT_TOPIC_STRUGGLE_RATIO: ${env:ALERT_TOPIC_STRUGGLE_RATIO, '0.5'}
    ALERT_STUDENT_DROP_TREND: ${env:ALERT_STUDENT_DROP_TREND, '-0.15'}
    ALERT_UNIT_OFF_TRACK_FLOOR: ${env:ALERT_UNIT_OFF_TRACK_FLOOR, '0.4'}
    ALERT_GUIDE_COMPLETE_RATIO: ${env:ALERT_GUIDE_COMPLETE_RATIO, '0.9'}
    ALERT_GUIDE_COMMON_ERROR_RATIO: ${env:ALERT_GUIDE_COMMON_ERROR_RATIO, '0.3'}

custom:
  customDomain:
    domainName: ai.superprofes.app
    basePath: ''
    stage: ${self:provider.stage}
    createRoute53Record: false
    endpointType: REGIONAL
    securityPolicy: tls_1_2
    autoDomain: false

plugins:
  - serverless-domain-manager

functions:
  health:
    image:
      name: ai-engine-image
      command:
        - src.pipeline.health.handler
    timeout: 10
    memorySize: 128
    events:
      - http:
          method: GET
          path: /health

  llmClassifier:
    image:
      name: ai-engine-image
      command:
        - src.pipeline.llm_consumer.handler
    timeout: 300
    memorySize: 512
    events:
      - sqs:
          arn: ${env:SQS_LLM_CLASSIFY_ARN}
          batchSize: 20
          maximumBatchingWindow: 60
          functionResponseType: ReportBatchItemFailures

  nightlyBkt:
    image:
      name: ai-engine-image
      command:
        - src.pipeline.nightly_bkt.handler
    timeout: 900
    memorySize: 1024
    events:
      - schedule:
          rate: cron(0 7 * * ? *)
          enabled: true

  nightlyIrt:
    image:
      name: ai-engine-image
      command:
        - src.pipeline.nightly_irt.handler
    timeout: 900
    memorySize: 1024
    events:
      - schedule:
          rate: cron(15 7 * * ? *)
          enabled: true

  hourlyAlerts:
    image:
      name: ai-engine-image
      command:
        - src.pipeline.hourly_alerts.handler
    # Scans mastery + published-guide state and writes deduped TeacherAlerts (M11/A9.2).
    timeout: 900
    memorySize: 1024
    events:
      - schedule:
          rate: cron(0 * * * ? *)
          enabled: true

  ocrWorker:
    image:
      name: ai-engine-image
      command:
        - src.pipeline.ocr_worker.handler
    timeout: 60
    memorySize: 512
    events:
      - sqs:
          arn: ${env:SQS_OCR_QUEUE_ARN}
          batchSize: 5
          functionResponseType: ReportBatchItemFailures

  guideIngest:
    image:
      name: ai-engine-image
      command:
        - src.pipeline.guide_ingest_worker.handler
    # Generous: chunked Sonnet PDF extraction + pypdfium2 figure rendering.
    timeout: 600
    memorySize: 2048
    events:
      - sqs:
          arn: ${env:SQS_GUIDE_INGEST_ARN}
          # One guide per invocation — each is a heavy multi-call PDF job.
          batchSize: 1
          functionResponseType: ReportBatchItemFailures

  solutionGenerator:
    image:
      name: ai-engine-image
      command:
        - src.pipeline.solution_generator.handler
    # One Sonnet call per question (text-only) + topic classification.
    timeout: 600
    memorySize: 1024
    events:
      - sqs:
          arn: ${env:SQS_SOLUTION_GEN_ARN}
          # One guide per invocation — each fans out to per-question LLM calls.
          batchSize: 1
          functionResponseType: ReportBatchItemFailures

  submissionGrader:
    image:
      name: ai-engine-image
      command:
        - src.pipeline.submission_grader.handler
    # One Haiku vision call per submission (photos + cached pauta), up to 5 per batch.
    timeout: 120
    memorySize: 512
    events:
      - sqs:
          arn: ${env:SQS_SUBMISSION_GRADE_ARN}
          batchSize: 5
          functionResponseType: ReportBatchItemFailures
