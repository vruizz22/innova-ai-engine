name: Deploy Lambdas

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv and serverless
        run: |
          pip install uv
          npm install -g serverless@3 serverless-domain-manager

      - name: Deploy
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          SQS_LLM_CLASSIFY_ARN: ${{ secrets.SQS_LLM_CLASSIFY_ARN }}
          SQS_OCR_QUEUE_ARN: ${{ secrets.SQS_OCR_QUEUE_ARN }}
          OCR_CONFIDENCE_THRESHOLD: ${{ secrets.OCR_CONFIDENCE_THRESHOLD || '0.7' }}
          LLM_BATCH_SIZE: ${{ secrets.LLM_BATCH_SIZE || '20' }}
          SSM_LLM_PAUSED_PARAM: ${{ secrets.SSM_LLM_PAUSED_PARAM || '/innova/llm/paused' }}
          SSM_OCR_PAUSED_PARAM: ${{ secrets.SSM_OCR_PAUSED_PARAM || '/innova/ocr/paused' }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL || 'info' }}
        run: serverless deploy --stage prod
